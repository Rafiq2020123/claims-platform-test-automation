name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:unit

  contract-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: claimpay
          POSTGRES_PASSWORD: claimpay
          POSTGRES_DB: claimpay
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U claimpay"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    env:
      DATABASE_URL: postgres://claimpay:claimpay@localhost:5432/claimpay
      AUTH_SECRET: ci-only-secret-not-for-anything-real-0000
      SEED_PASSWORD: ci-only-password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run db:migrate
      - run: npm run db:seed
      - run: npm run test:contract:consumer
      - name: The committed contract is the one the consumer tests produce
        run: git diff --exit-code -- pacts/
      - run: npm run test:contract:provider

  e2e-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: claimpay
          POSTGRES_PASSWORD: claimpay
          POSTGRES_DB: claimpay
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U claimpay"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    env:
      DATABASE_URL: postgres://claimpay:claimpay@localhost:5432/claimpay
      AUTH_SECRET: ci-only-secret-not-for-anything-real-0000
      SEED_PASSWORD: claimpay-demo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run db:migrate
      - run: npm run db:seed
      - run: npm run test:e2e
      - name: Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

  app-smoke:
    name: App starts in Docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose up --build --detach --wait
      - name: Health check
        run: |
          curl --fail --silent http://localhost:3000/api/health | tee health.json
          grep -q '"status":"ok"' health.json
      - name: Home page is served
        run: curl --fail --silent --output /dev/null http://localhost:3000/
      - name: Logs
        if: always()
        run: docker compose logs --no-color
      - name: Surface logs as an annotation
        if: failure()
        run: |
          msg=$(docker compose logs --no-color --tail 60 2>&1 | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')
          echo "::error title=compose logs::${msg}"
      - if: always()
        run: docker compose down --volumes
