services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: claimpay
      POSTGRES_PASSWORD: claimpay
      POSTGRES_DB: claimpay
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U claimpay']
      interval: 2s
      timeout: 3s
      retries: 15

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://claimpay:claimpay@db:5432/claimpay
      AUTH_SECRET: ${AUTH_SECRET:-local-dev-secret-not-for-anything-real}
      SEED_PASSWORD: ${SEED_PASSWORD:-claimpay-demo}
      DEMO_DEFECT: ${DEMO_DEFECT:-}
      DEMO_LATENCY_MS: ${DEMO_LATENCY_MS:-0}
    ports:
      - '3000:3000'
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:3000/api/health || exit 1']
      interval: 2s
      timeout: 3s
      retries: 30
